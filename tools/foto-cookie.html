<!DOCTYPE html>
<html lang="da">
<head><meta charset="UTF-8"><title>Foto</title></head>
<body>
<!-- Bruges af tools/regnehelten-billeder.py og tools/biblioteket-billeder.py. Spillene kræver login i
     testperioden; en (falsk) login-cookie lader dem starte på den lokale
     server, hvor PHP ikke kører. Siden bliver ikke lagt op (tools/ er
     udeladt i deploy.yml). -->
<script>
document.cookie = 'lf_in=elev.0; path=/';
// #<scene> = Regnehelten (som før); #<spil>:<scene> = et andet spil, fx #biblioteket:hal
var h = location.hash.slice(1), m = h.match(/^(\w+):(\w+)$/);
location.replace('/spil/' + (m ? m[1] : 'regnehelten') + '/#foto=' + (m ? m[2] : h));
</script>
</body>
</html>
