<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start eventyret — Learnification</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140f1c">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #140f1c; color: #f4eefc; font-family: "Atkinson Hyperlegible", system-ui, sans-serif; text-align: center; }
  a { color: #ffcc4d; }
</style>
</head>
<body>

<!-- "Start eventyret her"-knappen i menuen peger hertil. Siden regner ud, hvor barnet skal hen:
     ikke logget ind -> /login?til=/start/ (og herefter tilbage hertil)
     ellers          -> kun_spil (forældrenes valg, findes endnu ikke) -> testrundens start -> Eventyrbiblioteket -->
<p id="tekst">Et øjeblik …</p>
<noscript><p><a href="/spil/biblioteket/">Gå ind i Eventyrbiblioteket</a></p></noscript>

<script src="/assets/konto.js?v=6"></script>
<script>
(function () {
  var SPIL = ['runeborg', 'regnehelten'];

  function startSted(d) {
    // Forældrene kan (senere) vælge, at barnet kun må spille ét af spillene
    if (SPIL.indexOf(d.kun_spil) > -1) return '/spil/' + d.kun_spil + '/';
    // Skoletestens runde bestemmer, hvor man starter
    if (d.test && d.test_start) return '/spil/' + d.test_start + '/';
    return '/spil/biblioteket/';
  }

  function loginFoerst() { location.replace('/login?til=' + encodeURIComponent('/start/')); }

  LF.hent('konto', 'mig').then(function (d) {
    if (!d || !d.logget_ind) { loginFoerst(); return; }
    location.replace(startSted(d));
  }).catch(function () { loginFoerst(); });
})();
</script>
</body>
</html>
