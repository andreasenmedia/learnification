<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spil Regnehelten — Learnification</title>
<meta name="description" content="Regnehelten er et gratis dansk matematikspil for 1.-6. klasse. En helt almindelig skoledag — fuld af tal. Spil direkte i browseren.">
<meta name="theme-color" content="#140f1c">
<meta property="og:type" content="website">
<meta property="og:title" content="Spil Regnehelten">
<meta property="og:description" content="En helt almindelig skoledag — fuld af tal. Gratis dansk matematikspil for 1.-6. klasse.">
<meta property="og:image" content="https://learnification.dk/assets/billeder/regnehelten-by.png">
<meta property="og:url" content="https://learnification.dk/spil/regnehelten/">
<link rel="canonical" href="https://learnification.dk/spil/regnehelten/">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/skrifter/runeborg.css?v=1">
<link rel="stylesheet" href="regnehelten.css?v=4">
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="screen" width="320" height="180" aria-label="Regnehelten — spilverdenen"></canvas>

    <!-- HUD: missionen øverst til venstre, Regnekraft og tasken øverst til højre -->
    <div id="hud" hidden>
      <div id="hud-quest"><span class="hud-label">Mission</span><span id="hud-quest-title"></span><span id="hud-quest-goal"></span></div>
      <div id="hud-right">
        <span class="hud-chip" title="Regnekraft — vokser, når du regner"><i class="ico ico-kraft"></i><span class="kraft-meter"><i id="hud-kraft-bar"></i></span><b id="hud-kraft">10 %</b></span>
        <button class="hud-chip hud-btn" id="hud-bag" type="button" title="Tasken (I)"><i class="ico ico-bag"></i><b id="hud-ting">0</b></button>
        <button class="hud-btn" id="btn-book" type="button" title="Dagbogen (B)">Bog</button>
        <button class="hud-btn" id="btn-full" type="button" title="Fuld skærm (F)" aria-label="Fuld skærm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
        <button class="hud-btn" id="btn-menu" type="button" title="Menu (Esc)">Menu</button>
      </div>
    </div>

    <div id="prompt" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="fade"></div>

    <!-- Alle vinduer (dialog, opgaver, bog, menu) lægger sig her -->
    <div id="layer"></div>

    <!-- Berøringsknapper — vises først, når nogen rører skærmen, og gemmer
         sig igen efter 5 sekunder uden berøring -->
    <div id="touch" hidden>
      <div id="stick-zone" aria-hidden="true">
        <div id="stick-base"><div id="stick-knob"></div></div>
      </div>
      <div id="tbtns">
        <button id="t-act" type="button">E</button>
        <button id="t-book" type="button">Bog</button>
      </div>
    </div>
    <div id="vkbd" hidden aria-hidden="true"></div>
  </div>
</div>

<noscript><p style="color:#fff;padding:24px;font-family:sans-serif">Regnehelten kræver JavaScript.</p></noscript>

<!-- Login foran spillet og måling af spilletid. KRAEV_LOGIN = false
     lader alle spille igen, når testen er slut (se også Runeborg). -->
<script src="/assets/spilletid.js?v=2"></script>
<script>
var KRAEV_LOGIN = true;
// aktiv: false — tiden tæller først, når spillet er i gang (game.js begin()), ikke på titelskærmen.
// Prøvetiden er 60 min pr. barn på tværs af begge spil (tid_status() i api/_kerne.php).
LFSpil.start({ spil: 'regnehelten', kraevLogin: KRAEV_LOGIN, aktiv: false,
               bruger: function (d) { window.LF_SPILLER = d; },
               tidenErGaaet: function () { if (window.RH && RH.tidSlut) RH.tidSlut(); },
               snartSlut: function (sek) { if (window.RH && RH.tidSnart) RH.tidSnart(sek); } });
</script>
<script src="js/art.js?v=3"></script>
<script src="js/audio.js?v=3"></script>
<script src="js/world.js?v=3"></script>
<script src="js/voice.js?v=2"></script>
<script src="js/opgaver.js?v=3"></script>
<script src="js/opgaver-kapitler.js?v=2"></script>
<script src="js/ui.js?v=7"></script>
<script src="js/content.js?v=3"></script>
<script src="js/kapitel2.js?v=2"></script>
<script src="js/kapitel3.js?v=2"></script>
<script src="js/gem.js?v=3"></script>
<script src="js/resultat.js?v=3"></script>
<script src="js/game.js?v=5"></script>
<script src="/assets/besoeg.js?v=2" defer></script>
<script>
// Første tryk eller tast i spillet tæller som "startet Regnehelten" i statistikken
(function () {
  function start() {
    removeEventListener('pointerdown', start, true);
    removeEventListener('keydown', start, true);
    if (window.LFMaal) LFMaal('spil_regnehelten');
  }
  addEventListener('pointerdown', start, true);
  addEventListener('keydown', start, true);
})();
</script>
</body>
</html>
